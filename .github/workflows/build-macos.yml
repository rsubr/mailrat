name: Build macOS App

on:
  push:
    branches: [main, native-ui]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # Apple silicon (arm64)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./internal/...

      - name: Install fyne packager
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package .app
        working-directory: cmd/mailrat
        run: fyne package -os darwin -release

      - name: Zip app bundle
        working-directory: cmd/mailrat
        run: ditto -c -k --keepParent mailrat.app ../../mailrat-macos-arm64.zip

      - name: Checksum
        run: shasum -a 256 mailrat-macos-arm64.zip | tee mailrat-macos-arm64.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mailrat-macos-arm64
          path: |
            mailrat-macos-arm64.zip
            mailrat-macos-arm64.zip.sha256
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mailrat-macos-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mailrat-macos-arm64.zip
            mailrat-macos-arm64.zip.sha256

  update-tap:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Check tap deploy key
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            echo "::error::Secret HOMEBREW_TAP_DEPLOY_KEY is not set. Add a write deploy key to rsubr/homebrew-mailrat and store its private half as a repo secret named HOMEBREW_TAP_DEPLOY_KEY."
            exit 1
          fi

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: rsubr/homebrew-mailrat
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release download "$TAG" -R "${{ github.repository }}" -p mailrat-macos-arm64.zip -D "$RUNNER_TEMP"
          sha=$(sha256sum "$RUNNER_TEMP/mailrat-macos-arm64.zip" | cut -d' ' -f1)
          sed -i -E "s/^(  version \").*(\")/\1${version}\2/; s/^(  sha256 \").*(\")/\1${sha}\2/" Casks/mailrat.rb
          grep -q "version \"${version}\"" Casks/mailrat.rb
          grep -q "sha256 \"${sha}\"" Casks/mailrat.rb
          if git diff --quiet; then
            echo "Cask already at ${version}; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "mailrat ${version}"
          git push
