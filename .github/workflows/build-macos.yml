name: Build macOS App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build macOS app
        run: wails build -platform darwin/amd64 -o mailrat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailrat-macos
          path: build/bin/mailrat.app
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mailrat-macos

      - name: Zip app bundle
        run: zip -r mailrat-macos.zip mailrat.app

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: mailrat-macos.zip
