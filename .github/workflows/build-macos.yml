name: Build macOS App

on:
  push:
    branches: [main, native-ui]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./internal/...

      - name: Install fyne packager
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package .app
        working-directory: cmd/mailrat
        run: fyne package -os darwin -release

      - name: Zip app bundle
        working-directory: cmd/mailrat
        run: ditto -c -k --keepParent mailrat.app ../../mailrat-macos-${{ matrix.arch }}.zip

      - name: Build CLI binary
        run: |
          CGO_ENABLED=1 go build -ldflags="-s -w" -o mailrat-darwin-${{ matrix.arch }} ./cmd/mailrat

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mailrat-macos-${{ matrix.arch }}
          path: |
            mailrat-macos-${{ matrix.arch }}.zip
            mailrat-darwin-${{ matrix.arch }}
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mailrat-macos-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mailrat-macos-*.zip
            mailrat-darwin-*
