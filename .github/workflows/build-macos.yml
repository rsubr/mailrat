name: Build macOS App

on:
  push:
    branches: [main, native-ui]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # Apple silicon (arm64)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./internal/...

      - name: Install fyne packager
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package .app
        working-directory: cmd/mailrat
        run: fyne package -os darwin -release

      - name: Zip app bundle
        working-directory: cmd/mailrat
        run: ditto -c -k --keepParent mailrat.app ../../mailrat-macos-arm64.zip

      - name: Checksum
        run: shasum -a 256 mailrat-macos-arm64.zip | tee mailrat-macos-arm64.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mailrat-macos-arm64
          path: |
            mailrat-macos-arm64.zip
            mailrat-macos-arm64.zip.sha256
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mailrat-macos-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mailrat-macos-arm64.zip
            mailrat-macos-arm64.zip.sha256
