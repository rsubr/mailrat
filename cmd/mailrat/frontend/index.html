<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>mailrat</title>
  <script src="/js/tailwind.min.js"></script>
  <link rel="stylesheet" href="/css/app.css"/>
  <script src="/js/wails-compat.js"></script>
  <script src="/js/app.js"></script>
  <script defer src="/js/alpine.min.js"></script>
</head>
<body class="h-screen w-screen overflow-hidden flex text-sm select-none"
      x-data
      x-init="$store.mail.init()">

  <!-- SVG icon sprite -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="icon-INBOX" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
    </symbol>
    <symbol id="icon-STARRED" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
    </symbol>
    <symbol id="icon-SENT" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
    </symbol>
    <symbol id="icon-DRAFT" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
      <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
    </symbol>
    <symbol id="icon-IMPORTANT" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
    </symbol>
    <symbol id="icon-SPAM" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </symbol>
    <symbol id="icon-TRASH" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m3 0l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
      <line x1="10" y1="11" x2="10" y2="17"/>
      <line x1="14" y1="11" x2="14" y2="17"/>
    </symbol>
    <symbol id="icon-ALL_MAIL" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="7" width="20" height="14" rx="2"/>
      <path d="M16 3H8a2 2 0 00-2 2v2h12V5a2 2 0 00-2-2z"/>
      <path d="M2 11l10 6 10-6"/>
    </symbol>
    <symbol id="icon-SNOOZED" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12 6 12 12 16 14"/>
    </symbol>
    <symbol id="icon-_tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/>
      <line x1="7" y1="7" x2="7.01" y2="7"/>
    </symbol>
    <symbol id="icon-attachment" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
    </symbol>
    <!-- Filled star — used for YELLOW_STAR and BLUE_STAR; inherits currentColor -->
    <symbol id="icon-star-filled" viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
    </symbol>
    <!-- RED_CIRCLE: red circle with white exclamation mark -->
    <symbol id="icon-star-bang" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10.5" fill="currentColor"/>
      <rect x="11.25" y="5.5" width="1.5" height="7.5" rx="0.75" fill="white"/>
      <circle cx="12" cy="17.25" r="1.25" fill="white"/>
    </symbol>
    <!-- ORANGE_CIRCLE: orange circle with white double-chevron guillemet (») -->
    <symbol id="icon-star-guillemet" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10.5" fill="currentColor"/>
      <path d="M8 8.5l3.5 3.5L8 15.5" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12.5 8.5l3.5 3.5-3.5 3.5" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- GREEN_CIRCLE: green circle with white checkmark -->
    <symbol id="icon-star-check" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10.5" fill="currentColor"/>
      <path d="M7 12.5l3.5 3.5 6.5-7" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- PURPLE_CIRCLE: purple circle with white question mark -->
    <symbol id="icon-star-question" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10.5" fill="currentColor"/>
      <path d="M9.5 9.5a2.5 2.5 0 015 0c0 2.5-2.5 2-2.5 4.5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="12" cy="17.5" r="1.25" fill="white"/>
    </symbol>
  </svg>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  LEFT SIDEBAR                                                          -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <aside :class="sidebarOpen ? 'w-60' : 'w-10'"
         class="bg-sidebar border-r border-divider flex flex-col h-full flex-shrink-0 transition-all duration-200 overflow-hidden"
         x-data="sidebar">

    <!-- Header: burger + title + theme toggle + compose -->
    <div class="h-14 flex items-center px-2 flex-shrink-0" :class="sidebarOpen ? 'justify-between' : 'justify-center'">
      <!-- Burger menu -->
      <button @click="sidebarOpen = !sidebarOpen"
              class="text-secondary hover-primary transition-colors flex-shrink-0 p-1"
              title="Toggle sidebar">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <div x-show="sidebarOpen" class="flex items-center justify-between flex-1 pl-2">
        <span class="text-primary font-semibold text-sm tracking-tight">mailrat</span>
        <div class="flex items-center space-x-2">
          <!-- Theme toggle -->
          <button @click="store.toggleTheme()"
                  class="text-secondary hover-primary transition-colors"
                  :title="store.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
            <template x-if="store.theme === 'dark'">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
              </svg>
            </template>
            <template x-if="store.theme === 'light'">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
              </svg>
            </template>
          </button>
          <!-- Compose -->
          <button @click="openCompose()"
                  class="text-secondary hover-primary transition-colors"
                  title="Compose (C)">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5
                       m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Account switcher -->
    <div x-show="sidebarOpen" class="px-3 pb-3 flex-shrink-0">
      <!-- Unified inbox -->
      <button @click="selectAccount('unified')"
              :class="store.activeAccountId === 'unified'
                      ? 'bg-active-item text-primary'
                      : 'hover-bg text-secondary'"
              class="w-full flex items-center px-2 py-1.5 rounded-md text-xs mb-0.5 transition-colors">
        <svg class="w-4 h-4 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        All Inboxes
      </button>

      <!-- Per-account buttons -->
      <template x-for="acc in store.accounts" :key="acc.id">
        <button @click="selectAccount(acc.id)"
                :class="store.activeAccountId === acc.id
                        ? 'bg-active-item text-primary'
                        : 'hover-bg text-secondary'"
                class="w-full flex items-center px-2 py-1.5 rounded-md text-xs mb-0.5 transition-colors">
          <svg class="w-4 h-4 mr-2 text-blue-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
          </svg>
          <span class="truncate" x-text="acc.email"></span>
        </button>
      </template>

      <!-- Add account button -->
      <button @click="store.addAccount()"
              :disabled="store.addingAccount"
              class="w-full flex items-center px-2 py-1.5 rounded-md text-xs text-secondary hover-bg transition-colors disabled:opacity-40 mt-0.5">
        <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        <span x-text="store.addingAccount ? 'Opening browser…' : 'Add account'"></span>
      </button>
    </div>

    <!-- Navigation -->
    <nav x-show="sidebarOpen" class="flex-1 overflow-y-auto px-2 pb-4">

      <!-- Pinned system labels (always visible) -->
      <ul class="space-y-0.5 mb-1">
        <template x-for="label in pinnedLabels" :key="label.id">
          <li>
            <button @click="selectLabel(label.id)"
                    :class="isActiveLabel(label.id) ? 'nav-item-active' : 'hover-bg text-secondary'"
                    class="w-full flex items-center text-left px-2 py-1.5 rounded-md text-sm transition-colors">
              <svg class="w-4 h-4 mr-2 flex-shrink-0"><use :href="'#icon-' + iconKey(label.id)"/></svg>
              <span class="truncate flex-1" x-text="label.name"></span>
              <span x-show="unreadCount(label.id) > 0" x-text="unreadCount(label.id)"
                    class="ml-1 text-xs font-medium text-blue-500 flex-shrink-0"></span>
            </button>
          </li>
        </template>
      </ul>

      <!-- More toggle (only when there are additional labels) -->
      <template x-if="hasMore">
        <div>
          <!-- Toggle button -->
          <button @click="moreOpen = !moreOpen"
                  class="w-full flex items-center px-2 py-1.5 rounded-md hover-bg text-secondary transition-colors text-sm">
            <svg class="w-4 h-4 mr-2 flex-shrink-0 transition-transform duration-150"
                 :style="moreOpen ? 'transform:rotate(180deg)' : ''"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
            <span x-text="moreOpen ? 'Less' : 'More'"></span>
          </button>

          <!-- Expanded section -->
          <ul x-show="moreOpen" class="space-y-0.5 mt-0.5">
            <!-- Additional system labels (Important, Spam, Trash, etc.) -->
            <template x-for="label in moreSystemLabels" :key="label.id">
              <li>
                <button @click="selectLabel(label.id)"
                        :class="isActiveLabel(label.id) ? 'nav-item-active' : 'hover-bg text-secondary'"
                        class="w-full flex items-center text-left px-2 py-1.5 rounded-md text-sm transition-colors">
                  <svg class="w-4 h-4 mr-2 flex-shrink-0"><use :href="'#icon-' + iconKey(label.id)"/></svg>
                  <span class="truncate flex-1" x-text="label.name"></span>
                  <span x-show="unreadCount(label.id) > 0" x-text="unreadCount(label.id)"
                        class="ml-1 text-xs font-medium text-blue-500 flex-shrink-0"></span>
                </button>
              </li>
            </template>

            <!-- Labels section header (only if user labels exist) -->
            <template x-if="userLabels.length > 0">
              <li class="pt-3 pb-0.5">
                <p class="text-xs font-semibold text-tertiary uppercase tracking-wider px-2">Labels</p>
              </li>
            </template>

            <!-- User-created labels -->
            <template x-for="label in userLabels" :key="label.id">
              <li>
                <button @click="selectLabel(label.id)"
                        :class="isActiveLabel(label.id) ? 'nav-item-active' : 'hover-bg text-secondary'"
                        class="w-full flex items-center text-left px-2 py-1.5 rounded-md text-sm transition-colors">
                  <template x-if="label.backgroundColor">
                    <span class="w-3 h-3 rounded-full mr-2 flex-shrink-0"
                          :style="'background-color:' + label.backgroundColor"></span>
                  </template>
                  <template x-if="!label.backgroundColor">
                    <svg class="w-4 h-4 mr-2 flex-shrink-0"><use :href="'#icon-' + iconKey(label.id)"/></svg>
                  </template>
                  <span class="truncate flex-1" x-text="label.name"></span>
                  <span x-show="unreadCount(label.id) > 0" x-text="unreadCount(label.id)"
                        class="ml-1 text-xs font-medium text-blue-500 flex-shrink-0"></span>
                </button>
              </li>
            </template>
          </ul>
        </div>
      </template>

    </nav>

    <!-- Sync status bar -->
    <div x-show="sidebarOpen" class="px-3 py-2 border-t border-divider flex-shrink-0 flex items-center justify-between">
      <span class="text-xs text-tertiary" x-text="
        store.syncStatus === 'syncing' ? ('Syncing' + (store.syncAccount ? ' ' + store.syncAccount : '') + '…') :
        store.syncStatus === 'done'    ? 'Up to date' : ''
      "></span>
      <div class="flex items-center space-x-1">
        <button @click="store.openSettings()"
                class="text-secondary hover-primary transition-colors"
                title="Settings">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </button>
        <button @click="store.sync()"
                :disabled="store.syncStatus === 'syncing'"
                class="text-secondary hover-primary disabled:opacity-40 transition-colors"
                title="Sync now (S)">
          <svg class="w-4 h-4" :class="{ 'animate-spin': store.syncStatus === 'syncing' }"
               fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9
                     m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>
  <!-- END SIDEBAR -->


  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  MIDDLE — EMAIL LIST                                                   -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <section class="w-80 bg-list border-r border-divider flex flex-col h-full flex-shrink-0"
           x-data="emailList"
           @keydown.window="
             if(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA'||document.activeElement.isContentEditable)return;
             if($event.key==='/'){$event.preventDefault();$refs.searchInput.focus();}
             if($event.key==='!'){$event.preventDefault(); store.activeLabel === 'SPAM' ? store.markNotSpam() : store.markSpam();}
           "

    <!-- Header -->
    <header class="h-14 flex items-center justify-between px-4 border-b border-divider flex-shrink-0">
      <h2 class="font-semibold text-primary text-sm" x-text="
        store.activeAccountId === 'unified' ? 'All Inboxes' :
        (store.accounts.find(a => a.id === store.activeAccountId)?.email || 'Inbox')
      "></h2>
      <div class="flex items-center space-x-2">
        <!-- Sync spinner -->
        <template x-if="store.syncStatus === 'syncing'">
          <svg class="w-4 h-4 text-blue-400 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9
                     m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </template>
      </div>
    </header>

    <!-- Search box -->
    <div class="px-3 py-2 border-b border-divider flex-shrink-0 flex items-center gap-2">
      <!-- API error indicator -->
      <template x-if="store.apiErrors.length > 0">
        <button @click="store.errorLogOpen = true"
                class="text-red-400 hover:text-red-300 flex-shrink-0 transition-colors"
                title="API errors — click to view">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          </svg>
        </button>
      </template>
      <div class="relative flex-1">
        <span class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-tertiary">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </span>
        <input type="text"
               x-ref="searchInput"
               x-model="store.searchQuery"
               @input="doSearchInput()"
               @keydown="doSearch($event)"
               placeholder="Search"
               class="w-full bg-input border border-divider text-primary text-xs rounded-md
                      pl-8 pr-3 py-1.5 focus:outline-none focus:border-blue-500 placeholder-themed"/>
      </div>
    </div>

    <!-- Thread list -->
    <div class="flex-1 overflow-y-auto" x-ref="threadList" @scroll.passive="store.onListScroll($event)">

      <!-- Loading state -->
      <template x-if="store.loading">
        <div class="flex items-center justify-center h-32 text-tertiary text-xs">
          Loading…
        </div>
      </template>

      <!-- Empty state -->
      <template x-if="!store.loading && store.threads.length === 0">
        <div class="flex flex-col items-center justify-center h-40 text-tertiary text-xs space-y-2">
          <svg class="w-8 h-8 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6
                     a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414
                     a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414
                     A1 1 0 006.586 13H4"/>
          </svg>
          <span x-text="store.searchQuery ? 'No results' : 'No messages'"></span>
        </div>
      </template>

      <!-- Thread items -->
      <template x-if="!store.loading">
        <div>
          <template x-for="thread in store.threads" :key="thread.id + thread.accountId">
            <article @click="selectThread(thread)"
                     :class="isActive(thread) ? 'bg-active-item' : (thread.isUnread ? 'bg-unread-item hover-bg' : 'hover-bg')"
                     class="px-3 py-2.5 border-b border-divider cursor-pointer transition-colors">

              <!-- Row 1: sender + date -->
              <div class="flex justify-between items-baseline mb-0.5">
                <div class="flex items-center space-x-1.5 min-w-0">
                  <!-- Unread indicator -->
                  <template x-if="thread.isUnread">
                    <span class="unread-dot flex-shrink-0"></span>
                  </template>
                  <!-- Star indicator: SVG icon from starInfo() -->
                  <template x-if="starInfo(thread)">
                    <svg class="w-3.5 h-3.5 flex-shrink-0" :class="starInfo(thread).cls">
                      <use :href="'#' + starInfo(thread).icon"/>
                    </svg>
                  </template>
                  <h3 class="truncate text-sm font-medium"
                      :class="thread.isUnread ? 'text-primary' : 'text-secondary'"
                      x-text="thread.participants || thread.accountId"></h3>
                  <!-- Message count badge -->
                  <template x-if="thread.messageCount > 1">
                    <span class="text-tertiary text-xs flex-shrink-0" x-text="thread.messageCount"></span>
                  </template>
                </div>
                <span class="text-xs text-secondary ml-2 flex-shrink-0" x-text="formatDate(thread.date)"></span>
              </div>

              <!-- Row 2: subject -->
              <p :class="thread.isUnread ? 'font-semibold text-primary' : 'text-secondary'"
                 class="text-xs truncate mb-0.5" x-text="thread.subject || '(no subject)'"></p>

              <!-- Row 3: snippet + label chips + attachment icon (same line) -->
              <div class="flex items-center gap-1 min-w-0">
                <p class="text-secondary text-xs truncate flex-1 min-w-0" x-text="thread.snippet"></p>
                <template x-for="lid in visibleLabels(thread)" :key="lid">
                  <span class="text-xs px-1.5 py-0.5 rounded leading-none flex-shrink-0"
                        :style="labelInfo(lid)?.backgroundColor
                          ? 'background-color:' + labelInfo(lid).backgroundColor + ';color:' + (labelInfo(lid).textColor || '#ffffff')
                          : ''"
                        :class="labelInfo(lid)?.backgroundColor ? '' : 'bg-subtle text-tertiary'"
                        x-text="labelName(lid)"></span>
                </template>
                <template x-if="thread.hasAttachments">
                  <svg class="w-3 h-3 text-tertiary flex-shrink-0"><use href="#icon-attachment"/></svg>
                </template>
              </div>

            </article>
          </template>
          <!-- Load-more spinner -->
          <div x-show="store.loadingMore" class="flex justify-center py-4 text-tertiary text-xs" style="display:none">
            <svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
          </div>
        </div>
      </template>

    </div>
  </section>
  <!-- END EMAIL LIST -->


  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  RIGHT — READING PANE / COMPOSE                                        -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <main class="flex-1 bg-reading flex flex-col h-full min-w-0"
        x-data="readingPane"
        @keydown.window.capture="handleKeydown($event)">

    <!-- ── Full-pane compose (new message) ─────────────────────────────────── -->
    <template x-if="store.composing && store.composeMode === 'new'">
      <div class="flex flex-col h-full" x-init="initEditor()">

        <div class="h-14 flex items-center justify-between px-5 border-b border-divider flex-shrink-0">
          <h2 class="font-semibold text-primary text-sm">New Message</h2>
          <button @click="store.closeCompose()" class="text-secondary hover-primary transition-colors" title="Discard (Esc)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <template x-if="store.accounts.length > 1">
          <div class="px-5 py-2.5 border-b border-divider flex items-center flex-shrink-0">
            <span class="text-secondary text-xs w-16 flex-shrink-0">From</span>
            <select x-model="data.accountId" class="flex-1 bg-transparent text-primary text-sm focus:outline-none">
              <template x-for="acc in store.accounts" :key="acc.id">
                <option :value="acc.id" x-text="acc.email"></option>
              </template>
            </select>
          </div>
        </template>

        <div class="px-5 py-2.5 border-b border-divider flex items-center flex-shrink-0">
          <span class="text-secondary text-xs w-16 flex-shrink-0">To</span>
          <div class="relative flex-1" x-data="addressField('to')">
            <input type="text" x-model="value" x-ref="input" @input="onInput()" @keydown="onKeydown($event)" @blur="onBlur()" placeholder="Recipients"
                   class="w-full bg-transparent text-primary text-sm focus:outline-none placeholder-themed"/>
            <div x-show="open" class="absolute top-full left-0 z-50 w-72 bg-sidebar border border-divider rounded-md shadow-lg overflow-hidden" style="display:none">
              <template x-for="(s, i) in suggestions" :key="s.email">
                <div @mousedown.prevent="select(s)" :class="i === activeIdx ? 'bg-active-item' : 'hover-bg'" class="px-3 py-2 cursor-pointer">
                  <div class="text-primary text-xs font-medium" x-text="s.name || s.email"></div>
                  <div x-show="s.name" class="text-secondary text-xs" x-text="s.email"></div>
                </div>
              </template>
            </div>
          </div>
          <div class="flex items-center space-x-2 ml-2 flex-shrink-0">
            <button @click="store.showCc = !store.showCc"
                    :class="store.showCc ? 'text-blue-400' : 'text-tertiary hover-primary'"
                    class="text-xs transition-colors" title="CC (⌘⇧C)">Cc</button>
            <button @click="store.showBcc = !store.showBcc"
                    :class="store.showBcc ? 'text-blue-400' : 'text-tertiary hover-primary'"
                    class="text-xs transition-colors" title="BCC (⌘⇧B)">Bcc</button>
          </div>
        </div>

        <div x-show="store.showCc" class="px-5 py-2.5 border-b border-divider flex items-center flex-shrink-0" style="display:none">
          <span class="text-secondary text-xs w-16 flex-shrink-0">Cc</span>
          <div class="relative flex-1" x-data="addressField('cc')">
            <input type="text" x-model="value" x-ref="input" @input="onInput()" @keydown="onKeydown($event)" @blur="onBlur()" placeholder="CC recipients"
                   class="w-full bg-transparent text-primary text-sm focus:outline-none placeholder-themed"/>
            <div x-show="open" class="absolute top-full left-0 z-50 w-72 bg-sidebar border border-divider rounded-md shadow-lg overflow-hidden" style="display:none">
              <template x-for="(s, i) in suggestions" :key="s.email">
                <div @mousedown.prevent="select(s)" :class="i === activeIdx ? 'bg-active-item' : 'hover-bg'" class="px-3 py-2 cursor-pointer">
                  <div class="text-primary text-xs font-medium" x-text="s.name || s.email"></div>
                  <div x-show="s.name" class="text-secondary text-xs" x-text="s.email"></div>
                </div>
              </template>
            </div>
          </div>
        </div>

        <div x-show="store.showBcc" class="px-5 py-2.5 border-b border-divider flex items-center flex-shrink-0" style="display:none">
          <span class="text-secondary text-xs w-16 flex-shrink-0">Bcc</span>
          <div class="relative flex-1" x-data="addressField('bcc')">
            <input type="text" x-model="value" x-ref="input" @input="onInput()" @keydown="onKeydown($event)" @blur="onBlur()" placeholder="BCC recipients"
                   class="w-full bg-transparent text-primary text-sm focus:outline-none placeholder-themed"/>
            <div x-show="open" class="absolute top-full left-0 z-50 w-72 bg-sidebar border border-divider rounded-md shadow-lg overflow-hidden" style="display:none">
              <template x-for="(s, i) in suggestions" :key="s.email">
                <div @mousedown.prevent="select(s)" :class="i === activeIdx ? 'bg-active-item' : 'hover-bg'" class="px-3 py-2 cursor-pointer">
                  <div class="text-primary text-xs font-medium" x-text="s.name || s.email"></div>
                  <div x-show="s.name" class="text-secondary text-xs" x-text="s.email"></div>
                </div>
              </template>
            </div>
          </div>
        </div>

        <div class="px-5 py-2.5 border-b border-divider flex items-center flex-shrink-0">
          <span class="text-secondary text-xs w-16 flex-shrink-0">Subject</span>
          <input type="text" x-model="data.subject" placeholder="Subject"
                 class="flex-1 bg-transparent text-primary text-sm focus:outline-none placeholder-themed"/>
        </div>

        <div class="px-4 py-1.5 border-b border-divider flex items-center flex-shrink-0" style="gap:2px">
          <button @mousedown.prevent="exec('bold')"          class="toolbar-btn" title="Bold (⌘B)"><span class="font-bold text-xs">B</span></button>
          <button @mousedown.prevent="exec('italic')"        class="toolbar-btn" title="Italic (⌘I)"><span class="italic text-xs">I</span></button>
          <button @mousedown.prevent="exec('underline')"     class="toolbar-btn" title="Underline (⌘U)"><span class="underline text-xs">U</span></button>
          <button @mousedown.prevent="exec('strikeThrough')" class="toolbar-btn" title="Strikethrough"><span class="line-through text-xs">S</span></button>
          <div class="w-px h-4 toolbar-sep mx-1"></div>
          <button @mousedown.prevent="exec('insertUnorderedList')" class="toolbar-btn" title="Bullet list">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01"/></svg>
          </button>
          <button @mousedown.prevent="exec('insertOrderedList')" class="toolbar-btn" title="Numbered list">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 5h11M10 12h11M10 19h11M4 5v3m0 0v.01M4 8h-.01M4 12a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
          </button>
          <div class="w-px h-4 toolbar-sep mx-1"></div>
          <button @mousedown.prevent="insertLink()" class="toolbar-btn" title="Insert link">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.1-1.1m-.757-4.9a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
          </button>
          <div class="w-px h-4 toolbar-sep mx-1"></div>
          <button @mousedown.prevent="exec('removeFormat')" class="toolbar-btn" title="Remove formatting">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M10 4l4 4-7.94 7.94L4 20h8"/></svg>
          </button>
        </div>

        <div class="flex-1 overflow-y-auto px-5 py-4">
          <div contenteditable="true" x-ref="editor"
               @input="store.composeData.body = $el.innerHTML"
               data-placeholder="Write your message…"
               class="compose-editor text-primary text-sm leading-relaxed"></div>
        </div>

        <div class="px-5 py-3 border-t border-divider flex items-center justify-between flex-shrink-0">
          <div class="flex items-center space-x-3">
            <span class="text-tertiary text-xs">⌘↩ to send</span>
            <p x-show="store.sendError" x-text="store.sendError" class="text-red-400 text-xs" style="display:none"></p>
          </div>
          <div class="flex items-center space-x-2">
            <button x-show="store.canSendAndArchive()" @click="syncAndSend(true)" :disabled="store.sending || !data.to || !data.subject"
                    class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white text-sm font-medium rounded-lg transition-colors"
                    style="display:none">
              <span x-text="store.sending ? 'Sending…' : 'Send and archive'"></span>
            </button>
            <button @click="syncAndSend()" :disabled="store.sending || !data.to || !data.subject"
                    class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white text-sm font-medium rounded-lg transition-colors">
              <span x-text="store.sending ? 'Sending…' : 'Send'"></span>
            </button>
          </div>
        </div>

      </div>
    </template>
    <!-- END FULL COMPOSE -->

    <!-- ── Reading pane + optional inline compose ───────────────────────────── -->
    <template x-if="!store.composing || store.composeMode !== 'new'">
      <div class="flex flex-col h-full">

        <!-- Toolbar -->
        <div class="h-14 flex items-center justify-between px-5 border-b border-divider flex-shrink-0">
          <div class="flex items-center space-x-5 text-secondary">
            <!-- Archive -->
            <button class="hover-primary transition-colors" title="Archive">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/>
              </svg>
            </button>
            <!-- Delete -->
            <button @click="store.trashThread()"
                    :class="store.activeThread ? 'hover-primary cursor-pointer' : 'opacity-30 cursor-default'"
                    class="transition-colors" title="Delete">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7
                         m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
            <!-- Spam / Not Spam -->
            <button @click="store.activeLabel === 'SPAM' ? store.markNotSpam() : store.markSpam()"
                    :class="store.activeThread ? 'hover-primary cursor-pointer' : 'opacity-30 cursor-default'"
                    class="transition-colors" :title="store.activeLabel === 'SPAM' ? 'Not spam (!)' : 'Report spam (!)'">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      :d="store.activeLabel === 'SPAM' 
                          ? 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z'
                          : 'M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z'"/>
              </svg>
            </button>
            <!-- Mark as unread -->
            <button @click="store.markUnread()"
                    :class="store.activeThread ? 'hover-primary cursor-pointer' : 'opacity-30 cursor-default'"
                    class="transition-colors" title="Mark as unread">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </button>

            <div class="w-px h-5 bg-divider"></div>

            <!-- Reply -->
            <button @click="store.activeThread && reply(store.messages[store.messages.length - 1])"
                    class="hover-primary transition-colors" title="Reply (R)">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
              </svg>
            </button>
            <!-- Reply All -->
            <button @click="store.activeThread && replyAll(store.messages[store.messages.length - 1])"
                    class="hover-primary transition-colors" title="Reply All">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6M7 10h3"/>
              </svg>
            </button>
            <!-- Forward -->
            <button @click="store.activeThread && forward(store.messages[store.messages.length - 1])"
                    class="hover-primary transition-colors" title="Forward">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6"/>
              </svg>
            </button>
          </div>

          <!-- Search in reading pane -->
          <div class="relative w-56">
            <span class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-tertiary">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </span>
            <input type="text" placeholder="Search in conversation"
                   class="w-full bg-input border border-divider text-primary text-xs rounded-md
                          pl-8 pr-3 py-1.5 focus:outline-none focus:border-blue-500 placeholder-themed"/>
          </div>
        </div>

        <!-- Content area -->
        <div class="flex-1 overflow-hidden flex flex-col">

          <!-- Empty state -->
          <template x-if="!store.activeThread">
            <div class="flex-1 flex flex-col items-center justify-center text-tertiary space-y-3">
              <svg class="w-16 h-16 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                      d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5
                         a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
              <p class="text-sm">Select a conversation</p>
            </div>
          </template>

          <!-- Thread content -->
          <template x-if="store.activeThread">
            <div class="flex-1 overflow-y-auto">
              <div class="p-6 lg:p-10 max-w-4xl mx-auto w-full">

                <div class="flex items-start justify-between mb-7">
                  <div class="flex items-center space-x-3 min-w-0">
                    <h1 class="text-2xl font-bold text-primary truncate"
                        x-text="store.activeThread.subject || '(no subject)'"></h1>
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs bg-subtle text-secondary flex-shrink-0">Inbox</span>
                  </div>
                  <button @click="reply(store.messages[store.messages.length - 1])"
                          class="text-secondary hover-primary flex-shrink-0 ml-4 transition-colors" title="Reply">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
                    </svg>
                  </button>
                </div>

                <template x-for="(msg, idx) in store.messages" :key="msg.id">
                  <div :class="idx < store.messages.length - 1 ? 'mb-4' : ''" class="group">

                    <template x-if="!isExpanded(msg.id)">
                      <div @click="toggle(msg)"
                           class="flex items-center justify-between py-2 px-1 rounded-lg cursor-pointer hover-bg transition-colors">
                        <div class="flex items-center space-x-3 min-w-0">
                          <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-semibold flex-shrink-0"
                               :style="'background-color:' + avatarColor(msg.from || '')">
                            <span x-text="initials(msg.from || '')"></span>
                          </div>
                          <div class="min-w-0">
                            <span class="text-sm font-medium text-primary truncate block" x-text="msg.from || 'Unknown'"></span>
                            <span class="text-xs text-secondary truncate block" x-text="msg.snippet"></span>
                          </div>
                        </div>
                        <div class="flex items-center space-x-2 text-secondary ml-4 flex-shrink-0">
                          <span class="text-xs" x-text="formatDate(msg.date)"></span>
                          <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                          </svg>
                        </div>
                      </div>
                    </template>

                    <template x-if="isExpanded(msg.id)">
                      <div class="mb-2">
                        <div class="flex items-start justify-between mb-4">
                          <div class="flex items-center space-x-3 min-w-0">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-semibold flex-shrink-0"
                                 :style="'background-color:' + avatarColor(msg.from || '')">
                              <span x-text="initials(msg.from || '')"></span>
                            </div>
                            <div class="min-w-0">
                              <span class="font-bold text-primary text-sm block" x-text="msg.from || 'Unknown'"></span>
                              <div class="text-xs text-secondary mt-0.5">To: <span class="text-primary" x-text="msg.to || ''"></span></div>
                              <template x-if="msg.cc">
                                <div class="text-xs text-secondary mt-0.5">Cc: <span class="text-primary" x-text="msg.cc"></span></div>
                              </template>
                              <template x-if="msg.bcc">
                                <div class="text-xs text-secondary mt-0.5">Bcc: <span class="text-primary" x-text="msg.bcc"></span></div>
                              </template>
                            </div>
                          </div>
                          <div class="flex items-center space-x-3 text-secondary ml-4 flex-shrink-0">
                            <span class="text-xs" x-text="formatDate(msg.date)"></span>
                            <div class="flex space-x-1">
                              <button @click.stop="toggle(msg)" class="hover-primary p-1 rounded transition-colors" title="Collapse">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
                              </button>
                              <button @click.stop="reply(msg)" class="hover-primary p-1 rounded transition-colors" title="Reply">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
                              </button>
                            </div>
                          </div>
                        </div>

                        <!-- Attachment chips: one per file, above body -->
                        <template x-if="msg.attachments && msg.attachments.length > 0">
                          <div class="flex flex-wrap gap-2 mb-3" style="margin-left:3.25rem">
                            <template x-for="att in msg.attachments" :key="att.attachmentId || att.name">
                              <button @click.stop="openAttachment(msg, att)"
                                      class="inline-flex items-center gap-1.5 bg-subtle hover-bg border border-divider rounded px-2.5 py-1.5 text-xs text-primary transition-colors cursor-pointer"
                                      :title="att.name">
                                <svg class="w-3 h-3 text-secondary flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
                                </svg>
                                <span class="truncate max-w-[160px]" x-text="att.name"></span>
                                <span class="text-tertiary flex-shrink-0" x-text="formatAttSize(att.size)"></span>
                              </button>
                            </template>
                          </div>
                        </template>

                        <div style="margin-left:3.25rem">
                          <template x-if="!msg.body"><p class="text-tertiary text-xs italic">Loading…</p></template>
                          <template x-if="msg.body && !msg.body.trim().startsWith('<')">
                            <pre class="text-primary text-sm whitespace-pre-wrap font-sans leading-relaxed message-body" x-text="msg.body"></pre>
                          </template>
                          <template x-if="msg.body && msg.body.trim().startsWith('<')">
                            <div class="text-sm message-body message-body-html" x-html="msg.body"></div>
                          </template>
                        </div>
                      </div>
                    </template>

                  </div>
                </template>

                <!-- Quick reply bar (hidden while composing) -->
                <template x-if="store.messages.length > 0 && !store.composing">
                  <div class="mt-6">
                    <button @click="reply(store.messages[store.messages.length - 1])"
                            class="w-full text-left border border-divider rounded-lg px-4 py-3
                                   hover-bg text-secondary text-sm transition-colors cursor-text">
                      Reply…
                    </button>
                  </div>
                </template>

              </div>
            </div>
          </template>

          <!-- Inline compose (reply / forward) -->
          <template x-if="store.composing && store.composeMode !== 'new'">
            <div class="flex-shrink-0 bg-sidebar border-t-2 border-blue-600/30 flex flex-col"
                 style="height: 300px" x-init="initEditor()">

              <!-- Header: mode label + To field + close -->
              <div class="px-5 py-2 border-b border-divider flex items-center justify-between flex-shrink-0">
                <div class="flex items-center space-x-2 min-w-0 flex-1 mr-3">
                  <span class="text-blue-400 text-xs font-semibold flex-shrink-0 uppercase tracking-wide"
                        x-text="store.composeMode === 'forward' ? 'Fwd' : 'Re'"></span>
                  <span class="text-secondary flex-shrink-0">·</span>
                  <div class="relative flex-1 min-w-0" x-data="addressField('to')">
                    <input type="text" x-model="value" x-ref="input" @input="onInput()" @keydown="onKeydown($event)" @blur="onBlur()" placeholder="To"
                           class="w-full bg-transparent text-primary text-sm focus:outline-none placeholder-themed"/>
                    <div x-show="open" class="absolute top-full left-0 z-50 w-72 bg-sidebar border border-divider rounded-md shadow-lg overflow-hidden" style="display:none">
                      <template x-for="(s, i) in suggestions" :key="s.email">
                        <div @mousedown.prevent="select(s)" :class="i === activeIdx ? 'bg-active-item' : 'hover-bg'" class="px-3 py-2 cursor-pointer">
                          <div class="text-primary text-xs font-medium" x-text="s.name || s.email"></div>
                          <div x-show="s.name" class="text-secondary text-xs" x-text="s.email"></div>
                        </div>
                      </template>
                    </div>
                  </div>
                  <template x-if="store.composeMode === 'forward'">
                    <input type="text" x-model="data.subject" placeholder="Subject"
                           class="w-48 bg-transparent text-secondary text-xs focus:outline-none placeholder-themed flex-shrink-0"/>
                  </template>
                  <div class="flex items-center space-x-2 flex-shrink-0">
                    <button @click="store.showCc = !store.showCc"
                            :class="store.showCc ? 'text-blue-400' : 'text-tertiary hover-primary'"
                            class="text-xs transition-colors" title="CC (⌘⇧C)">Cc</button>
                    <button @click="store.showBcc = !store.showBcc"
                            :class="store.showBcc ? 'text-blue-400' : 'text-tertiary hover-primary'"
                            class="text-xs transition-colors" title="BCC (⌘⇧B)">Bcc</button>
                  </div>
                </div>
                <button @click="store.closeCompose()"
                        class="text-secondary hover-primary transition-colors flex-shrink-0" title="Discard (Esc)">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                  </svg>
                </button>
              </div>

              <!-- CC row -->
              <div x-show="store.showCc" class="px-5 py-1.5 border-b border-divider flex items-center flex-shrink-0" style="display:none">
                <span class="text-secondary text-xs w-8 flex-shrink-0">Cc</span>
                <div class="relative flex-1" x-data="addressField('cc')">
                  <input type="text" x-model="value" x-ref="input" @input="onInput()" @keydown="onKeydown($event)" @blur="onBlur()" placeholder="CC recipients"
                         class="w-full bg-transparent text-primary text-sm focus:outline-none placeholder-themed"/>
                  <div x-show="open" class="absolute top-full left-0 z-50 w-72 bg-sidebar border border-divider rounded-md shadow-lg overflow-hidden" style="display:none">
                    <template x-for="(s, i) in suggestions" :key="s.email">
                      <div @mousedown.prevent="select(s)" :class="i === activeIdx ? 'bg-active-item' : 'hover-bg'" class="px-3 py-2 cursor-pointer">
                        <div class="text-primary text-xs font-medium" x-text="s.name || s.email"></div>
                        <div x-show="s.name" class="text-secondary text-xs" x-text="s.email"></div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

              <!-- BCC row -->
              <div x-show="store.showBcc" class="px-5 py-1.5 border-b border-divider flex items-center flex-shrink-0" style="display:none">
                <span class="text-secondary text-xs w-8 flex-shrink-0">Bcc</span>
                <div class="relative flex-1" x-data="addressField('bcc')">
                  <input type="text" x-model="value" x-ref="input" @input="onInput()" @keydown="onKeydown($event)" @blur="onBlur()" placeholder="BCC recipients"
                         class="w-full bg-transparent text-primary text-sm focus:outline-none placeholder-themed"/>
                  <div x-show="open" class="absolute top-full left-0 z-50 w-72 bg-sidebar border border-divider rounded-md shadow-lg overflow-hidden" style="display:none">
                    <template x-for="(s, i) in suggestions" :key="s.email">
                      <div @mousedown.prevent="select(s)" :class="i === activeIdx ? 'bg-active-item' : 'hover-bg'" class="px-3 py-2 cursor-pointer">
                        <div class="text-primary text-xs font-medium" x-text="s.name || s.email"></div>
                        <div x-show="s.name" class="text-secondary text-xs" x-text="s.email"></div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

              <!-- Formatting toolbar -->
              <div class="px-3 py-1 border-b border-divider flex items-center flex-shrink-0" style="gap:2px">
                <button @mousedown.prevent="exec('bold')"          class="toolbar-btn" title="Bold (⌘B)"><span class="font-bold text-xs">B</span></button>
                <button @mousedown.prevent="exec('italic')"        class="toolbar-btn" title="Italic (⌘I)"><span class="italic text-xs">I</span></button>
                <button @mousedown.prevent="exec('underline')"     class="toolbar-btn" title="Underline (⌘U)"><span class="underline text-xs">U</span></button>
                <button @mousedown.prevent="exec('strikeThrough')" class="toolbar-btn" title="Strikethrough"><span class="line-through text-xs">S</span></button>
                <div class="w-px h-4 toolbar-sep mx-1"></div>
                <button @mousedown.prevent="exec('insertUnorderedList')" class="toolbar-btn" title="Bullet list">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01"/></svg>
                </button>
                <button @mousedown.prevent="exec('insertOrderedList')" class="toolbar-btn" title="Numbered list">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 5h11M10 12h11M10 19h11M4 5v3m0 0v.01M4 8h-.01M4 12a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
                </button>
                <div class="w-px h-4 toolbar-sep mx-1"></div>
                <button @mousedown.prevent="insertLink()" class="toolbar-btn" title="Insert link">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.1-1.1m-.757-4.9a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                </button>
                <div class="w-px h-4 toolbar-sep mx-1"></div>
                <button @mousedown.prevent="exec('removeFormat')" class="toolbar-btn" title="Remove formatting">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M10 4l4 4-7.94 7.94L4 20h8"/></svg>
                </button>
              </div>

              <!-- Editor -->
              <div class="flex-1 overflow-y-auto px-5 py-2">
                <div contenteditable="true" x-ref="editor"
                     @input="store.composeData.body = $el.innerHTML"
                     data-placeholder="Write your reply…"
                     class="compose-editor text-primary text-sm leading-relaxed"></div>
              </div>

              <!-- Footer -->
              <div class="px-5 py-2 border-t border-divider flex items-center justify-between flex-shrink-0">
                <span class="text-tertiary text-xs">⌘↩ to send</span>
                <div class="flex items-center space-x-3">
                  <p x-show="store.sendError" x-text="store.sendError" class="text-red-400 text-xs" style="display:none"></p>
                  <button x-show="store.canSendAndArchive()" @click="syncAndSend(true)" :disabled="store.sending || !data.to"
                          class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white text-sm font-medium rounded-lg transition-colors"
                          style="display:none">
                    <span x-text="store.sending ? 'Sending…' : 'Send and archive'"></span>
                  </button>
                  <button @click="syncAndSend()" :disabled="store.sending || !data.to"
                          class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white text-sm font-medium rounded-lg transition-colors">
                    <span x-text="store.sending ? 'Sending…' : 'Send'"></span>
                  </button>
                </div>
              </div>

            </div>
          </template>
          <!-- END INLINE COMPOSE -->

        </div>
        <!-- END CONTENT AREA -->

      </div>
    </template>
    <!-- END READING PANE -->

  </main>

  <!-- Error toast -->
  <div x-show="$store.mail.error"
       x-transition
       class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50
              bg-red-900/90 border border-red-700 text-red-200 text-xs px-4 py-2 rounded-lg
              max-w-sm text-center"
       style="display:none">
    <span x-text="$store.mail.error"></span>
    <button @click="$store.mail.error = null" class="ml-2 underline">Dismiss</button>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  SETTINGS — full-page overlay replacing 3-col layout                   -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <div x-show="$store.mail.settingsOpen"
       @keydown.escape.window="$store.mail.settingsOpen = false"
       class="fixed inset-0 z-50 flex overflow-hidden"
       style="display:none; background-color: var(--bg-app);">

    <!-- ── Sidebar ── -->
    <aside class="w-64 bg-sidebar border-r border-divider flex flex-col flex-shrink-0 pt-8 pb-4">
      <div class="px-6 mb-8 flex items-center justify-between">
        <h1 class="text-xl font-semibold text-primary tracking-tight">Settings</h1>
        <button @click="$store.mail.settingsOpen = false"
                class="text-secondary hover-primary transition-colors"
                title="Close settings (Esc)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <nav class="flex-1 px-3 space-y-0.5">
        <!-- Accounts (active) -->
        <a @click.prevent="$store.mail.settingsNav = 'accounts'"
           :class="$store.mail.settingsNav === 'accounts'
             ? 'bg-white text-gray-900'
             : 'text-secondary hover-bg hover-primary'"
           class="group flex items-center px-3 py-2 text-sm font-medium rounded-md cursor-pointer transition-colors">
          <svg class="w-5 h-5 mr-3 flex-shrink-0" :class="$store.mail.settingsNav === 'accounts' ? 'text-blue-600' : 'text-secondary'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          Accounts
        </a>
        <!-- General (placeholder) -->
        <a class="text-secondary hover-bg hover-primary group flex items-center px-3 py-2 text-sm font-medium rounded-md cursor-pointer transition-colors opacity-50 pointer-events-none">
          <svg class="w-5 h-5 mr-3 flex-shrink-0 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          General
        </a>
        <!-- Appearance (placeholder) -->
        <a class="text-secondary hover-bg hover-primary group flex items-center px-3 py-2 text-sm font-medium rounded-md cursor-pointer transition-colors opacity-50 pointer-events-none">
          <svg class="w-5 h-5 mr-3 flex-shrink-0 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/>
          </svg>
          Appearance
        </a>
        <!-- Notifications (placeholder) -->
        <a class="text-secondary hover-bg hover-primary group flex items-center px-3 py-2 text-sm font-medium rounded-md cursor-pointer transition-colors opacity-50 pointer-events-none">
          <svg class="w-5 h-5 mr-3 flex-shrink-0 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          Notifications
        </a>
      </nav>
    </aside>

    <!-- ── Main content ── -->
    <main class="flex-1 overflow-y-auto" style="background-color: var(--bg-app);">
      <div class="max-w-4xl w-full mx-auto px-8 py-10">

        <!-- Error banner -->
        <div x-show="$store.mail.settingsError"
             class="mb-8 bg-red-900/60 border border-red-700 text-red-200 text-sm px-4 py-3 rounded-lg flex items-center justify-between"
             style="display:none">
          <span x-text="$store.mail.settingsError"></span>
          <button @click="$store.mail.settingsError = null" class="ml-4 underline flex-shrink-0">Dismiss</button>
        </div>

        <!-- ── Accounts section ── -->
        <div x-show="$store.mail.settingsNav === 'accounts'">

          <header class="mb-10">
            <h2 class="text-3xl font-bold text-primary tracking-tight">Email Account Management Settings</h2>
          </header>

          <!-- Accounts -->
          <section class="mb-12">
            <div class="flex items-center justify-between mb-6">
              <h3 class="text-xl font-semibold text-primary">Accounts</h3>
            </div>

            <!-- Add Account button -->
            <div class="mb-6">
              <button @click="$store.mail.addAccount()"
                      :disabled="$store.mail.addingAccount"
                      class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-500 disabled:opacity-40 transition-colors shadow-sm">
                <svg class="w-3.5 h-3.5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <span x-text="$store.mail.addingAccount ? 'Opening browser…' : 'Add Account'"></span>
              </button>
            </div>

            <!-- No accounts -->
            <template x-if="$store.mail.accounts.length === 0">
              <p class="text-secondary text-sm py-4">No accounts connected. Click "Add Account" to get started.</p>
            </template>

            <!-- Account list -->
            <div class="space-y-3">
              <template x-for="acc in $store.mail.accounts" :key="acc.id">
                <div class="border border-divider rounded-lg overflow-hidden" style="background-color: var(--bg-list);">

                  <!-- Account row -->
                  <div class="p-4 flex items-center justify-between hover-bg transition-colors">
                    <div class="flex items-center space-x-4">
                      <!-- Avatar -->
                      <div class="w-12 h-12 rounded-full overflow-hidden flex-shrink-0 bg-blue-600 flex items-center justify-center border border-divider">
                        <template x-if="acc.photoUrl">
                          <img :src="acc.photoUrl" class="w-full h-full object-cover" :alt="acc.displayName || acc.email"/>
                        </template>
                        <template x-if="!acc.photoUrl">
                          <span class="text-white text-lg font-semibold" x-text="acc.email.charAt(0).toUpperCase()"></span>
                        </template>
                      </div>
                      <div>
                        <p class="text-sm font-medium text-primary" x-text="acc.email"></p>
                        <p class="text-xs text-secondary" x-text="acc.displayName ? acc.displayName : (acc.id === $store.mail.activeAccountId ? 'Active' : 'Connected')"></p>
                      </div>
                    </div>
                    <div class="flex items-center space-x-3">
                      <!-- Edit toggle -->
                      <button @click="$store.mail.settingsEditingAccountId = ($store.mail.settingsEditingAccountId === acc.id ? null : acc.id)"
                              class="px-4 py-1.5 border border-divider text-sm font-medium rounded-md text-primary bg-subtle hover-bg transition-colors shadow-sm">
                        <span x-text="$store.mail.settingsEditingAccountId === acc.id ? 'Done' : 'Edit'"></span>
                      </button>
                      <!-- Remove -->
                      <button @click="
                                if (confirm('Remove ' + acc.email + '?\n\nAll local mail and data for this account will be permanently deleted.')) {
                                  $store.mail.removeAccount(acc.id);
                                }"
                              class="inline-flex items-center text-sm font-medium text-secondary hover:text-red-400 transition-colors">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                        Remove
                      </button>
                    </div>
                  </div>

                  <!-- Edit expansion: per-account sync settings -->
                  <div x-show="$store.mail.settingsEditingAccountId === acc.id && $store.mail.accountSettingsMap[acc.id]"
                       class="border-t border-divider px-6 py-5 space-y-5 bg-sidebar"
                       style="display:none">

                    <h4 class="text-sm font-medium text-primary">Sync Settings</h4>

                    <!-- Sync period -->
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between">
                      <label class="block text-sm font-medium text-primary mb-2 sm:mb-0 sm:w-1/3">Sync period</label>
                      <div class="relative sm:w-2/3">
                        <select :value="($store.mail.accountSettingsMap[acc.id] || {}).syncPeriod"
                                @change="$store.mail.accountSettingsMap[acc.id].syncPeriod = $event.target.value; $store.mail.saveAccountSettings(acc.id)"
                                class="block w-full pl-3 pr-10 py-2 text-sm border border-divider bg-sidebar text-primary focus:outline-none focus:ring-1 focus:ring-blue-500 rounded-md appearance-none">
                          <option value="30d">Last 30 days</option>
                          <option value="90d">Last 90 days</option>
                          <option value="1y">Last year</option>
                          <option value="all">All mail</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-secondary">
                          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </div>
                      </div>
                    </div>

                    <!-- Fetch attachments -->
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between">
                      <label class="block text-sm font-medium text-primary mb-2 sm:mb-0 sm:w-1/3">Download attachments</label>
                      <div class="sm:w-2/3">
                        <button @click="$store.mail.accountSettingsMap[acc.id].fetchAttachments = !$store.mail.accountSettingsMap[acc.id].fetchAttachments; $store.mail.saveAccountSettings(acc.id)"
                                :class="($store.mail.accountSettingsMap[acc.id] || {}).fetchAttachments ? 'bg-blue-600' : 'bg-subtle'"
                                class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none">
                          <span :class="($store.mail.accountSettingsMap[acc.id] || {}).fetchAttachments ? 'translate-x-6' : 'translate-x-1'"
                                class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform shadow-sm"></span>
                        </button>
                      </div>
                    </div>

                  </div>

                </div>
              </template>
            </div>
          </section>

          <hr class="border-divider mb-10"/>

          <!-- ── Global Sync Settings ── -->
          <section>
            <div class="space-y-6 max-w-2xl">

              <!-- Sync Frequency -->
              <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between">
                <label class="block text-sm font-medium text-primary mb-2 sm:mb-0 sm:w-1/3" for="sync-frequency">Sync Frequency</label>
                <div class="relative w-full sm:w-2/3">
                  <select id="sync-frequency"
                          :value="$store.mail.globalSettings.syncFrequency"
                          @change="$store.mail.globalSettings.syncFrequency = $event.target.value; $store.mail.saveGlobalSettings()"
                          class="block w-full pl-3 pr-10 py-2 text-sm border border-divider bg-sidebar text-primary focus:outline-none focus:ring-1 focus:ring-blue-500 rounded-md appearance-none">
                    <option value="15m">Every 15 minutes</option>
                    <option value="1h">Hourly</option>
                    <option value="manual">Manually</option>
                  </select>
                  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-secondary">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                  </div>
                </div>
              </div>

              <!-- Default Account -->
              <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between">
                <label class="block text-sm font-medium text-primary mb-2 sm:mb-0 sm:w-1/3" for="default-account">Default Account</label>
                <div class="relative w-full sm:w-2/3">
                  <select id="default-account"
                          :value="$store.mail.globalSettings.defaultAccountId"
                          @change="$store.mail.globalSettings.defaultAccountId = $event.target.value; $store.mail.saveGlobalSettings()"
                          class="block w-full pl-3 pr-10 py-2 text-sm border border-divider bg-sidebar text-primary focus:outline-none focus:ring-1 focus:ring-blue-500 rounded-md appearance-none">
                    <template x-for="acc in $store.mail.accounts" :key="acc.id">
                      <option :value="acc.id" x-text="acc.email"></option>
                    </template>
                  </select>
                  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-secondary">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                  </div>
                </div>
              </div>

            </div>
          </section>

        </div>
        <!-- end accounts section -->

      </div>
    </main>

  </div>

  <!-- API error log modal -->
  <div x-data x-show="$store.mail.errorLogOpen"
       x-on:keydown.escape.window="$store.mail.errorLogOpen = false"
       class="fixed inset-0 z-50 flex items-center justify-center compose-backdrop"
       style="display:none">
    <div class="bg-sidebar border border-divider rounded-lg shadow-2xl w-full max-w-lg mx-4 flex flex-col max-h-[70vh]">
      <!-- Header -->
      <div class="flex items-center justify-between px-4 py-3 border-b border-divider flex-shrink-0">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          </svg>
          <span class="text-sm font-semibold text-primary">API Error Log</span>
          <span class="text-xs text-tertiary" x-text="'(' + $store.mail.apiErrors.length + ' error' + ($store.mail.apiErrors.length === 1 ? '' : 's') + ')'"></span>
        </div>
        <div class="flex items-center gap-2">
          <button @click="$store.mail.clearAPIErrors()"
                  class="text-xs text-secondary hover:text-primary transition-colors px-2 py-1 rounded hover-bg">
            Clear all
          </button>
          <button @click="$store.mail.errorLogOpen = false"
                  class="p-1 rounded hover-bg text-secondary transition-colors" title="Close (Esc)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>
      <!-- Error entries -->
      <div class="overflow-y-auto flex-1 p-3 space-y-2">
        <template x-if="$store.mail.apiErrors.length === 0">
          <p class="text-xs text-tertiary text-center py-4">No errors</p>
        </template>
        <template x-for="(err, idx) in [...$store.mail.apiErrors].reverse()" :key="idx">
          <div class="rounded-md bg-subtle border border-divider px-3 py-2">
            <div class="text-xs text-tertiary mb-1" x-text="$store.mail.formatErrorTime(err.timestamp)"></div>
            <div class="text-xs text-primary font-mono break-all" x-text="err.message"></div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- Attachment viewer overlay -->
  <div x-data x-show="$store.mail.attachmentViewer.open"
       x-on:keydown.escape.window="$store.mail.closeAttachmentViewer()"
       class="fixed inset-0 z-50 flex flex-col bg-black/90"
       style="display:none">
    <!-- Toolbar -->
    <div class="flex items-center justify-between px-4 py-2 bg-sidebar border-b border-divider flex-shrink-0">
      <span class="text-sm font-medium text-primary truncate mr-4"
            x-text="$store.mail.attachmentViewer.name"></span>
      <div class="flex items-center gap-2 flex-shrink-0">
        <a :href="$store.mail.attachmentViewer.url"
           :download="$store.mail.attachmentViewer.name"
           class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-medium bg-subtle hover-bg text-primary border border-divider transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          Download
        </a>
        <button @click="$store.mail.closeAttachmentViewer()"
                class="p-1.5 rounded hover-bg text-secondary transition-colors" title="Close (Esc)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
    <!-- Content -->
    <div class="flex-1 overflow-hidden">
      <template x-if="$store.mail.attachmentViewer.open && $store.mail.attachmentViewer.mimeType.startsWith('image/')">
        <div class="w-full h-full flex items-center justify-center p-4 overflow-auto">
          <img :src="$store.mail.attachmentViewer.url"
               class="max-w-full max-h-full object-contain select-none"
               :alt="$store.mail.attachmentViewer.name">
        </div>
      </template>
      <template x-if="$store.mail.attachmentViewer.open && !$store.mail.attachmentViewer.mimeType.startsWith('image/')">
        <iframe :src="$store.mail.attachmentViewer.url"
                class="w-full h-full border-0"
                sandbox="allow-scripts allow-same-origin"></iframe>
      </template>
    </div>
  </div>

</body>
</html>
