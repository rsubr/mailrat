<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>mailrat</title>
  <script src="/js/tailwind.min.js"></script>
  <link rel="stylesheet" href="/css/app.css"/>
  <script src="/js/wails-compat.js"></script>
  <script src="/js/app.js"></script>
  <script defer src="/js/alpine.min.js"></script>
</head>
<body class="h-screen w-screen overflow-hidden flex text-sm select-none"
      x-data
      x-init="$store.mail.init()">

  <!-- SVG icon sprite -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="icon-INBOX" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
    </symbol>
    <symbol id="icon-STARRED" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
    </symbol>
    <symbol id="icon-SENT" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
    </symbol>
    <symbol id="icon-DRAFT" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
      <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
    </symbol>
    <symbol id="icon-IMPORTANT" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
    </symbol>
    <symbol id="icon-SPAM" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </symbol>
    <symbol id="icon-TRASH" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m3 0l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
      <line x1="10" y1="11" x2="10" y2="17"/>
      <line x1="14" y1="11" x2="14" y2="17"/>
    </symbol>
    <symbol id="icon-ALL_MAIL" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="7" width="20" height="14" rx="2"/>
      <path d="M16 3H8a2 2 0 00-2 2v2h12V5a2 2 0 00-2-2z"/>
      <path d="M2 11l10 6 10-6"/>
    </symbol>
    <symbol id="icon-SNOOZED" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12 6 12 12 16 14"/>
    </symbol>
    <symbol id="icon-_tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/>
      <line x1="7" y1="7" x2="7.01" y2="7"/>
    </symbol>
    <symbol id="icon-attachment" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
    </symbol>
    <symbol id="icon-star-filled" viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
    </symbol>
  </svg>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  LEFT SIDEBAR                                                          -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <aside class="w-60 bg-sidebar border-r border-divider flex flex-col h-full flex-shrink-0"
         x-data="sidebar">

    <!-- Header: title + theme toggle + compose -->
    <div class="h-14 flex items-center justify-between px-4 flex-shrink-0">
      <span class="text-primary font-semibold text-sm tracking-tight">mailrat</span>
      <div class="flex items-center space-x-2">
        <!-- Theme toggle -->
        <button @click="store.toggleTheme()"
                class="text-secondary hover-primary transition-colors"
                :title="store.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
          <template x-if="store.theme === 'dark'">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
            </svg>
          </template>
          <template x-if="store.theme === 'light'">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
          </template>
        </button>
        <!-- Compose -->
        <button @click="openCompose()"
                class="text-secondary hover-primary transition-colors"
                title="Compose (C)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5
                     m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Account switcher -->
    <div class="px-3 pb-3 flex-shrink-0">
      <!-- Unified inbox -->
      <button @click="selectAccount('unified')"
              :class="store.activeAccountId === 'unified'
                      ? 'bg-active-item text-primary'
                      : 'hover-bg text-secondary'"
              class="w-full flex items-center px-2 py-1.5 rounded-md text-xs mb-0.5 transition-colors">
        <svg class="w-4 h-4 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        All Inboxes
      </button>

      <!-- Per-account buttons -->
      <template x-for="acc in store.accounts" :key="acc.id">
        <button @click="selectAccount(acc.id)"
                :class="store.activeAccountId === acc.id
                        ? 'bg-active-item text-primary'
                        : 'hover-bg text-secondary'"
                class="w-full flex items-center px-2 py-1.5 rounded-md text-xs mb-0.5 transition-colors">
          <svg class="w-4 h-4 mr-2 text-blue-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
          </svg>
          <span class="truncate" x-text="acc.email"></span>
        </button>
      </template>

      <!-- No accounts placeholder -->
      <template x-if="store.accounts.length === 0">
        <p class="text-tertiary text-xs px-2 py-1">No accounts — run <code class="font-mono">mailrat accounts add</code></p>
      </template>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto px-2 pb-4">

      <!-- Pinned system labels (always visible) -->
      <ul class="space-y-0.5 mb-1">
        <template x-for="label in pinnedLabels" :key="label.id">
          <li>
            <button @click="selectLabel(label.id)"
                    :class="isActiveLabel(label.id) ? 'nav-item-active' : 'hover-bg text-secondary'"
                    class="w-full flex items-center px-2 py-1.5 rounded-md text-sm transition-colors">
              <svg class="w-4 h-4 mr-2 flex-shrink-0"><use :href="'#icon-' + iconKey(label.id)"/></svg>
              <span class="truncate" x-text="label.name"></span>
            </button>
          </li>
        </template>
      </ul>

      <!-- More toggle (only when there are additional labels) -->
      <template x-if="hasMore">
        <div>
          <!-- Toggle button -->
          <button @click="moreOpen = !moreOpen"
                  class="w-full flex items-center px-2 py-1.5 rounded-md hover-bg text-secondary transition-colors text-sm">
            <svg class="w-4 h-4 mr-2 flex-shrink-0 transition-transform duration-150"
                 :style="moreOpen ? 'transform:rotate(180deg)' : ''"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
            <span x-text="moreOpen ? 'Less' : 'More'"></span>
          </button>

          <!-- Expanded section -->
          <ul x-show="moreOpen" class="space-y-0.5 mt-0.5">
            <!-- Additional system labels (Important, Spam, Trash, etc.) -->
            <template x-for="label in moreSystemLabels" :key="label.id">
              <li>
                <button @click="selectLabel(label.id)"
                        :class="isActiveLabel(label.id) ? 'nav-item-active' : 'hover-bg text-secondary'"
                        class="w-full flex items-center px-2 py-1.5 rounded-md text-sm transition-colors">
                  <svg class="w-4 h-4 mr-2 flex-shrink-0"><use :href="'#icon-' + iconKey(label.id)"/></svg>
                  <span class="truncate" x-text="label.name"></span>
                </button>
              </li>
            </template>

            <!-- Labels section header (only if user labels exist) -->
            <template x-if="userLabels.length > 0">
              <li class="pt-3 pb-0.5">
                <p class="text-xs font-semibold text-tertiary uppercase tracking-wider px-2">Labels</p>
              </li>
            </template>

            <!-- User-created labels -->
            <template x-for="label in userLabels" :key="label.id">
              <li>
                <button @click="selectLabel(label.id)"
                        :class="isActiveLabel(label.id) ? 'nav-item-active' : 'hover-bg text-secondary'"
                        class="w-full flex items-center px-2 py-1.5 rounded-md text-sm transition-colors">
                  <svg class="w-4 h-4 mr-2 flex-shrink-0"><use :href="'#icon-' + iconKey(label.id)"/></svg>
                  <span class="truncate" x-text="label.name"></span>
                </button>
              </li>
            </template>
          </ul>
        </div>
      </template>

    </nav>

    <!-- Sync status bar -->
    <div class="px-3 py-2 border-t border-divider flex-shrink-0 flex items-center justify-between">
      <span class="text-xs text-tertiary" x-text="
        store.syncStatus === 'syncing' ? ('Syncing' + (store.syncAccount ? ' ' + store.syncAccount : '') + '…') :
        store.syncStatus === 'done'    ? 'Up to date' : ''
      "></span>
      <button @click="store.sync()"
              :disabled="store.syncStatus === 'syncing'"
              class="text-secondary hover-primary disabled:opacity-40 transition-colors"
              title="Sync now (S)">
        <svg class="w-4 h-4" :class="{ 'animate-spin': store.syncStatus === 'syncing' }"
             fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9
                   m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
    </div>
  </aside>
  <!-- END SIDEBAR -->


  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  MIDDLE — EMAIL LIST                                                   -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <section class="w-80 bg-list border-r border-divider flex flex-col h-full flex-shrink-0"
           x-data="emailList">

    <!-- Header -->
    <header class="h-14 flex items-center justify-between px-4 border-b border-divider flex-shrink-0">
      <h2 class="font-semibold text-primary text-sm" x-text="
        store.activeAccountId === 'unified' ? 'All Inboxes' :
        (store.accounts.find(a => a.id === store.activeAccountId)?.email || 'Inbox')
      "></h2>
      <div class="flex items-center space-x-2">
        <!-- Sync spinner -->
        <template x-if="store.syncStatus === 'syncing'">
          <svg class="w-4 h-4 text-blue-400 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9
                     m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </template>
      </div>
    </header>

    <!-- Search box -->
    <div class="px-3 py-2 border-b border-divider flex-shrink-0">
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-tertiary">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </span>
        <input type="text"
               x-model="store.searchQuery"
               @keydown="doSearch($event)"
               placeholder="Search"
               class="w-full bg-input border border-divider text-primary text-xs rounded-md
                      pl-8 pr-3 py-1.5 focus:outline-none focus:border-blue-500 placeholder-themed"/>
      </div>
    </div>

    <!-- Thread list -->
    <div class="flex-1 overflow-y-auto">

      <!-- Loading state -->
      <template x-if="store.loading">
        <div class="flex items-center justify-center h-32 text-tertiary text-xs">
          Loading…
        </div>
      </template>

      <!-- Empty state -->
      <template x-if="!store.loading && store.threads.length === 0">
        <div class="flex flex-col items-center justify-center h-40 text-tertiary text-xs space-y-2">
          <svg class="w-8 h-8 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6
                     a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414
                     a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414
                     A1 1 0 006.586 13H4"/>
          </svg>
          <span x-text="store.searchQuery ? 'No results' : 'No messages'"></span>
        </div>
      </template>

      <!-- Thread items -->
      <template x-if="!store.loading">
        <div>
          <template x-for="thread in store.threads" :key="thread.id + thread.accountId">
            <article @click="selectThread(thread)"
                     :class="isActive(thread) ? 'bg-active-item' : 'hover-bg'"
                     class="px-3 py-2.5 border-b border-divider cursor-pointer transition-colors">

              <!-- Row 1: sender + date -->
              <div class="flex justify-between items-baseline mb-0.5">
                <div class="flex items-center space-x-1.5 min-w-0">
                  <!-- Unread indicator -->
                  <template x-if="thread.isUnread">
                    <span class="unread-dot"></span>
                  </template>
                  <h3 class="truncate text-sm font-medium text-primary"
                      x-text="thread.participants || thread.accountId"></h3>
                  <!-- Message count badge -->
                  <template x-if="thread.messageCount > 1">
                    <span class="text-tertiary text-xs flex-shrink-0" x-text="thread.messageCount"></span>
                  </template>
                </div>
                <span class="text-xs text-secondary ml-2 flex-shrink-0" x-text="formatDate(thread.date)"></span>
              </div>

              <!-- Row 2: subject -->
              <p :class="thread.isUnread ? 'font-semibold text-primary' : 'text-secondary'"
                 class="text-xs truncate mb-0.5" x-text="thread.subject || '(no subject)'"></p>

              <!-- Row 3: snippet + attachment indicator -->
              <div class="flex items-center justify-between">
                <p class="text-secondary text-xs truncate pr-2" x-text="thread.snippet"></p>
                <template x-if="thread.hasAttachments">
                  <svg class="w-3 h-3 text-tertiary flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586
                             a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
                  </svg>
                </template>
              </div>

            </article>
          </template>
        </div>
      </template>

    </div>
  </section>
  <!-- END EMAIL LIST -->


  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  RIGHT — READING PANE / COMPOSE                                        -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <main class="flex-1 bg-reading flex flex-col h-full min-w-0"
        x-data="readingPane"
        @keydown.window="handleKeydown($event)">

    <!-- ── Full-pane compose (new message) ─────────────────────────────────── -->
    <template x-if="store.composing && store.composeMode === 'new'">
      <div class="flex flex-col h-full" x-init="initEditor()">

        <div class="h-14 flex items-center justify-between px-5 border-b border-divider flex-shrink-0">
          <h2 class="font-semibold text-primary text-sm">New Message</h2>
          <button @click="store.closeCompose()" class="text-secondary hover-primary transition-colors" title="Discard (Esc)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <template x-if="store.accounts.length > 1">
          <div class="px-5 py-2.5 border-b border-divider flex items-center flex-shrink-0">
            <span class="text-secondary text-xs w-16 flex-shrink-0">From</span>
            <select x-model="data.accountId" class="flex-1 bg-transparent text-primary text-sm focus:outline-none">
              <template x-for="acc in store.accounts" :key="acc.id">
                <option :value="acc.id" x-text="acc.email"></option>
              </template>
            </select>
          </div>
        </template>

        <div class="px-5 py-2.5 border-b border-divider flex items-center flex-shrink-0">
          <span class="text-secondary text-xs w-16 flex-shrink-0">To</span>
          <input type="text" x-model="data.to" placeholder="Recipients"
                 class="flex-1 bg-transparent text-primary text-sm focus:outline-none placeholder-themed"/>
        </div>

        <div class="px-5 py-2.5 border-b border-divider flex items-center flex-shrink-0">
          <span class="text-secondary text-xs w-16 flex-shrink-0">Subject</span>
          <input type="text" x-model="data.subject" placeholder="Subject"
                 class="flex-1 bg-transparent text-primary text-sm focus:outline-none placeholder-themed"/>
        </div>

        <div class="px-4 py-1.5 border-b border-divider flex items-center flex-shrink-0" style="gap:2px">
          <button @mousedown.prevent="exec('bold')"          class="toolbar-btn" title="Bold (⌘B)"><span class="font-bold text-xs">B</span></button>
          <button @mousedown.prevent="exec('italic')"        class="toolbar-btn" title="Italic (⌘I)"><span class="italic text-xs">I</span></button>
          <button @mousedown.prevent="exec('underline')"     class="toolbar-btn" title="Underline (⌘U)"><span class="underline text-xs">U</span></button>
          <button @mousedown.prevent="exec('strikeThrough')" class="toolbar-btn" title="Strikethrough"><span class="line-through text-xs">S</span></button>
          <div class="w-px h-4 toolbar-sep mx-1"></div>
          <button @mousedown.prevent="exec('insertUnorderedList')" class="toolbar-btn" title="Bullet list">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01"/></svg>
          </button>
          <button @mousedown.prevent="exec('insertOrderedList')" class="toolbar-btn" title="Numbered list">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 5h11M10 12h11M10 19h11M4 5v3m0 0v.01M4 8h-.01M4 12a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
          </button>
          <div class="w-px h-4 toolbar-sep mx-1"></div>
          <button @mousedown.prevent="insertLink()" class="toolbar-btn" title="Insert link">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.1-1.1m-.757-4.9a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
          </button>
          <div class="w-px h-4 toolbar-sep mx-1"></div>
          <button @mousedown.prevent="exec('removeFormat')" class="toolbar-btn" title="Remove formatting">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M10 4l4 4-7.94 7.94L4 20h8"/></svg>
          </button>
        </div>

        <div class="flex-1 overflow-y-auto px-5 py-4">
          <div contenteditable="true" x-ref="editor"
               @input="store.composeData.body = $el.innerHTML"
               data-placeholder="Write your message…"
               class="compose-editor text-primary text-sm leading-relaxed"></div>
        </div>

        <div class="px-5 py-3 border-t border-divider flex items-center justify-between flex-shrink-0">
          <div class="flex items-center space-x-3">
            <span class="text-tertiary text-xs">⌘↩ to send</span>
            <p x-show="store.sendError" x-text="store.sendError" class="text-red-400 text-xs" style="display:none"></p>
          </div>
          <button @click="syncAndSend()" :disabled="store.sending || !data.to || !data.subject"
                  class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white text-sm font-medium rounded-lg transition-colors">
            <span x-text="store.sending ? 'Sending…' : 'Send'"></span>
          </button>
        </div>

      </div>
    </template>
    <!-- END FULL COMPOSE -->

    <!-- ── Reading pane + optional inline compose ───────────────────────────── -->
    <template x-if="!store.composing || store.composeMode !== 'new'">
      <div class="flex flex-col h-full">

        <!-- Toolbar -->
        <div class="h-14 flex items-center justify-between px-5 border-b border-divider flex-shrink-0">
          <div class="flex items-center space-x-5 text-secondary">
            <!-- Archive -->
            <button class="hover-primary transition-colors" title="Archive">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/>
              </svg>
            </button>
            <!-- Delete -->
            <button @click="store.trashThread()"
                    :class="store.activeThread ? 'hover-primary cursor-pointer' : 'opacity-30 cursor-default'"
                    class="transition-colors" title="Delete">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7
                         m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
            <!-- Mark as unread -->
            <button @click="store.markUnread()"
                    :class="store.activeThread ? 'hover-primary cursor-pointer' : 'opacity-30 cursor-default'"
                    class="transition-colors" title="Mark as unread">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </button>

            <div class="w-px h-5 bg-divider"></div>

            <!-- Reply -->
            <button @click="store.activeThread && reply(store.messages[store.messages.length - 1])"
                    class="hover-primary transition-colors" title="Reply (R)">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
              </svg>
            </button>
            <!-- Forward -->
            <button @click="store.activeThread && forward(store.messages[store.messages.length - 1])"
                    class="hover-primary transition-colors" title="Forward">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6"/>
              </svg>
            </button>
          </div>

          <!-- Search in reading pane -->
          <div class="relative w-56">
            <span class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-tertiary">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </span>
            <input type="text" placeholder="Search in conversation"
                   class="w-full bg-input border border-divider text-primary text-xs rounded-md
                          pl-8 pr-3 py-1.5 focus:outline-none focus:border-blue-500 placeholder-themed"/>
          </div>
        </div>

        <!-- Content area -->
        <div class="flex-1 overflow-hidden flex flex-col">

          <!-- Empty state -->
          <template x-if="!store.activeThread">
            <div class="flex-1 flex flex-col items-center justify-center text-tertiary space-y-3">
              <svg class="w-16 h-16 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                      d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5
                         a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
              <p class="text-sm">Select a conversation</p>
            </div>
          </template>

          <!-- Thread content -->
          <template x-if="store.activeThread">
            <div class="flex-1 overflow-y-auto">
              <div class="p-6 lg:p-10 max-w-4xl mx-auto w-full">

                <div class="flex items-start justify-between mb-7">
                  <div class="flex items-center space-x-3 min-w-0">
                    <h1 class="text-2xl font-bold text-primary truncate"
                        x-text="store.activeThread.subject || '(no subject)'"></h1>
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs bg-subtle text-secondary flex-shrink-0">Inbox</span>
                  </div>
                  <button @click="reply(store.messages[store.messages.length - 1])"
                          class="text-secondary hover-primary flex-shrink-0 ml-4 transition-colors" title="Reply">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
                    </svg>
                  </button>
                </div>

                <template x-for="(msg, idx) in store.messages" :key="msg.id">
                  <div :class="idx < store.messages.length - 1 ? 'mb-4' : ''" class="group">

                    <template x-if="!isExpanded(msg.id)">
                      <div @click="toggle(msg)"
                           class="flex items-center justify-between py-2 px-1 rounded-lg cursor-pointer hover-bg transition-colors">
                        <div class="flex items-center space-x-3 min-w-0">
                          <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-semibold flex-shrink-0"
                               :style="'background-color:' + avatarColor(msg.from || '')">
                            <span x-text="initials(msg.from || '')"></span>
                          </div>
                          <div class="min-w-0">
                            <span class="text-sm font-medium text-primary truncate block" x-text="msg.from || 'Unknown'"></span>
                            <span class="text-xs text-secondary truncate block" x-text="msg.snippet"></span>
                          </div>
                        </div>
                        <div class="flex items-center space-x-2 text-secondary ml-4 flex-shrink-0">
                          <span class="text-xs" x-text="formatDate(msg.date)"></span>
                          <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                          </svg>
                        </div>
                      </div>
                    </template>

                    <template x-if="isExpanded(msg.id)">
                      <div class="mb-2">
                        <div class="flex items-start justify-between mb-4">
                          <div class="flex items-center space-x-3 min-w-0">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-semibold flex-shrink-0"
                                 :style="'background-color:' + avatarColor(msg.from || '')">
                              <span x-text="initials(msg.from || '')"></span>
                            </div>
                            <div class="min-w-0">
                              <span class="font-bold text-primary text-sm block" x-text="msg.from || 'Unknown'"></span>
                              <div class="text-xs text-secondary mt-0.5">To: <span class="text-primary" x-text="msg.to || ''"></span></div>
                            </div>
                          </div>
                          <div class="flex items-center space-x-3 text-secondary ml-4 flex-shrink-0">
                            <span class="text-xs" x-text="formatDate(msg.date)"></span>
                            <div class="flex space-x-1">
                              <button @click.stop="toggle(msg)" class="hover-primary p-1 rounded transition-colors" title="Collapse">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
                              </button>
                              <button @click.stop="reply(msg)" class="hover-primary p-1 rounded transition-colors" title="Reply">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
                              </button>
                            </div>
                          </div>
                        </div>

                        <div style="margin-left:3.25rem">
                          <template x-if="!msg.body"><p class="text-tertiary text-xs italic">Loading…</p></template>
                          <template x-if="msg.body && !msg.body.trim().startsWith('<')">
                            <pre class="text-primary text-sm whitespace-pre-wrap font-sans leading-relaxed message-body" x-text="msg.body"></pre>
                          </template>
                          <template x-if="msg.body && msg.body.trim().startsWith('<')">
                            <div class="text-primary text-sm message-body" x-html="msg.body"></div>
                          </template>
                          <template x-if="msg.hasAttachments">
                            <div class="mt-3 inline-flex items-center bg-subtle rounded px-2 py-1 text-xs text-primary">
                              <svg class="w-3 h-3 mr-1.5 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
                              </svg>
                              Attachment
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>

                  </div>
                </template>

                <!-- Quick reply bar (hidden while composing) -->
                <template x-if="store.messages.length > 0 && !store.composing">
                  <div class="mt-6">
                    <button @click="reply(store.messages[store.messages.length - 1])"
                            class="w-full text-left border border-divider rounded-lg px-4 py-3
                                   hover-bg text-secondary text-sm transition-colors cursor-text">
                      Reply…
                    </button>
                  </div>
                </template>

              </div>
            </div>
          </template>

          <!-- Inline compose (reply / forward) -->
          <template x-if="store.composing && store.composeMode !== 'new'">
            <div class="flex-shrink-0 bg-sidebar border-t-2 border-blue-600/30 flex flex-col"
                 style="height: 300px" x-init="initEditor()">

              <!-- Header: mode label + To field + close -->
              <div class="px-5 py-2 border-b border-divider flex items-center justify-between flex-shrink-0">
                <div class="flex items-center space-x-2 min-w-0 flex-1 mr-3">
                  <span class="text-blue-400 text-xs font-semibold flex-shrink-0 uppercase tracking-wide"
                        x-text="store.composeMode === 'forward' ? 'Fwd' : 'Re'"></span>
                  <span class="text-secondary flex-shrink-0">·</span>
                  <input type="text" x-model="data.to" placeholder="To"
                         class="flex-1 bg-transparent text-primary text-sm focus:outline-none placeholder-themed min-w-0"/>
                  <template x-if="store.composeMode === 'forward'">
                    <input type="text" x-model="data.subject" placeholder="Subject"
                           class="w-48 bg-transparent text-secondary text-xs focus:outline-none placeholder-themed flex-shrink-0"/>
                  </template>
                </div>
                <button @click="store.closeCompose()"
                        class="text-secondary hover-primary transition-colors flex-shrink-0" title="Discard (Esc)">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                  </svg>
                </button>
              </div>

              <!-- Formatting toolbar -->
              <div class="px-3 py-1 border-b border-divider flex items-center flex-shrink-0" style="gap:2px">
                <button @mousedown.prevent="exec('bold')"          class="toolbar-btn" title="Bold (⌘B)"><span class="font-bold text-xs">B</span></button>
                <button @mousedown.prevent="exec('italic')"        class="toolbar-btn" title="Italic (⌘I)"><span class="italic text-xs">I</span></button>
                <button @mousedown.prevent="exec('underline')"     class="toolbar-btn" title="Underline (⌘U)"><span class="underline text-xs">U</span></button>
                <button @mousedown.prevent="exec('strikeThrough')" class="toolbar-btn" title="Strikethrough"><span class="line-through text-xs">S</span></button>
                <div class="w-px h-4 toolbar-sep mx-1"></div>
                <button @mousedown.prevent="exec('insertUnorderedList')" class="toolbar-btn" title="Bullet list">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01"/></svg>
                </button>
                <button @mousedown.prevent="exec('insertOrderedList')" class="toolbar-btn" title="Numbered list">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 5h11M10 12h11M10 19h11M4 5v3m0 0v.01M4 8h-.01M4 12a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
                </button>
                <div class="w-px h-4 toolbar-sep mx-1"></div>
                <button @mousedown.prevent="insertLink()" class="toolbar-btn" title="Insert link">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.1-1.1m-.757-4.9a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                </button>
                <div class="w-px h-4 toolbar-sep mx-1"></div>
                <button @mousedown.prevent="exec('removeFormat')" class="toolbar-btn" title="Remove formatting">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M10 4l4 4-7.94 7.94L4 20h8"/></svg>
                </button>
              </div>

              <!-- Editor -->
              <div class="flex-1 overflow-y-auto px-5 py-2">
                <div contenteditable="true" x-ref="editor"
                     @input="store.composeData.body = $el.innerHTML"
                     data-placeholder="Write your reply…"
                     class="compose-editor text-primary text-sm leading-relaxed"></div>
              </div>

              <!-- Footer -->
              <div class="px-5 py-2 border-t border-divider flex items-center justify-between flex-shrink-0">
                <span class="text-tertiary text-xs">⌘↩ to send</span>
                <div class="flex items-center space-x-3">
                  <p x-show="store.sendError" x-text="store.sendError" class="text-red-400 text-xs" style="display:none"></p>
                  <button @click="syncAndSend()" :disabled="store.sending || !data.to"
                          class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white text-sm font-medium rounded-lg transition-colors">
                    <span x-text="store.sending ? 'Sending…' : 'Send'"></span>
                  </button>
                </div>
              </div>

            </div>
          </template>
          <!-- END INLINE COMPOSE -->

        </div>
        <!-- END CONTENT AREA -->

      </div>
    </template>
    <!-- END READING PANE -->

  </main>

  <!-- Error toast -->
  <div x-show="$store.mail.error"
       x-transition
       class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50
              bg-red-900/90 border border-red-700 text-red-200 text-xs px-4 py-2 rounded-lg
              max-w-sm text-center"
       style="display:none">
    <span x-text="$store.mail.error"></span>
    <button @click="$store.mail.error = null" class="ml-2 underline">Dismiss</button>
  </div>

</body>
</html>
