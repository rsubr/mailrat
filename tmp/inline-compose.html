<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Email Client Compose Panel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
<style data-purpose="custom-scrollbar">
    /* Custom Scrollbar for dark theme */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05); 
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2); 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3); 
    }
  </style>
<style data-purpose="editor-styles">
    .editor-toolbar-btn {
      @apply text-gray-400 hover:text-gray-200 p-1.5 rounded hover:bg-gray-700 transition-colors duration-200 text-sm;
    }
  </style>
</head>
<body class="bg-[#1e1e1e] text-gray-300 font-sans h-screen flex overflow-hidden selection:bg-blue-500/30">
<!-- BEGIN: MainContainer -->
<div class="flex w-full h-full">
<!-- BEGIN: Sidebar -->
<aside class="w-64 flex-shrink-0 flex flex-col bg-[#1e1e1e] border-r border-gray-800">
<div class="h-16 flex items-center justify-between px-4 pb-2 border-b border-gray-800/50">
<div class="w-8 h-8 rounded-full bg-gray-700"></div>
<button class="text-gray-500 hover:text-gray-300 transition-colors">
<i class="fa-solid fa-angles-left text-sm"></i>
</button>
</div>
<nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
<a class="flex items-center gap-3 px-3 py-2 rounded-md bg-gray-800/80 text-gray-200" href="#">
<i class="fa-solid fa-inbox text-gray-400 w-5 text-center"></i>
<span class="text-sm font-medium">Inbox</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-800/50 text-gray-400 hover:text-gray-200 transition-colors" href="#">
<i class="fa-regular fa-paper-plane w-5 text-center"></i>
<span class="text-sm font-medium">Sent</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-800/50 text-gray-400 hover:text-gray-200 transition-colors" href="#">
<i class="fa-regular fa-file-lines w-5 text-center"></i>
<span class="text-sm font-medium">Drafts</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-800/50 text-gray-400 hover:text-gray-200 transition-colors" href="#">
<i class="fa-solid fa-box-archive w-5 text-center"></i>
<span class="text-sm font-medium">Archive</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-800/50 text-gray-400 hover:text-gray-200 transition-colors" href="#">
<i class="fa-regular fa-trash-can w-5 text-center"></i>
<span class="text-sm font-medium">Trash</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-800/50 text-gray-400 hover:text-gray-200 transition-colors" href="#">
<i class="fa-solid fa-circle-exclamation w-5 text-center"></i>
<span class="text-sm font-medium">Spam</span>
</a>
</nav>
</aside>
<!-- END: Sidebar -->
<!-- BEGIN: Middle Column (List) -->
<!-- Applying a subtle frosted glass effect over this column as per mockup -->
<div class="w-[400px] flex-shrink-0 flex flex-col bg-[#252525]/80 backdrop-blur-sm border-r border-gray-800 relative">
<!-- Search Header -->
<div class="h-16 flex items-center px-4 gap-3 border-b border-gray-800">
<div class="relative flex-1">
<i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
<input class="w-full bg-transparent border-none pl-9 pr-4 py-2 text-sm text-gray-300 placeholder-gray-500 focus:ring-0" placeholder="Search" type="text"/>
</div>
<div class="flex items-center gap-3 text-gray-500">
<button class="hover:text-gray-300 transition-colors"><i class="fa-solid fa-filter text-sm"></i></button>
<button class="hover:text-gray-300 transition-colors"><i class="fa-solid fa-plus text-sm"></i></button>
<button class="hover:text-gray-300 transition-colors"><i class="fa-regular fa-pen-to-square text-sm"></i></button>
<button class="hover:text-gray-300 transition-colors"><i class="fa-solid fa-gear text-sm"></i></button>
</div>
</div>
<!-- Blurred List Content -->
<div class="flex-1 overflow-hidden p-4 space-y-6 opacity-20 blur-sm pointer-events-none">
<!-- List Item Placeholder 1 -->
<div class="flex gap-3">
<div class="w-3 h-3 mt-1 rounded-full bg-gray-600 flex-shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-3 bg-gray-600 rounded w-1/3"></div>
<div class="h-2 bg-gray-700 rounded w-3/4"></div>
<div class="h-2 bg-gray-700 rounded w-full"></div>
<div class="h-2 bg-gray-700 rounded w-5/6"></div>
</div>
<div class="h-2 bg-gray-600 rounded w-8"></div>
</div>
<!-- List Item Placeholder 2 -->
<div class="flex gap-3">
<div class="w-3 h-3 mt-1 rounded-full bg-gray-600 flex-shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-3 bg-gray-600 rounded w-1/4"></div>
<div class="h-2 bg-gray-700 rounded w-2/3"></div>
<div class="h-2 bg-gray-700 rounded w-full"></div>
</div>
<div class="h-2 bg-gray-600 rounded w-8"></div>
</div>
<!-- List Item Placeholder 3 -->
<div class="flex gap-3">
<div class="w-3 h-3 mt-1 rounded-full bg-gray-600 flex-shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-3 bg-gray-600 rounded w-2/5"></div>
<div class="h-2 bg-gray-700 rounded w-full"></div>
<div class="h-2 bg-gray-700 rounded w-4/5"></div>
</div>
<div class="h-2 bg-gray-600 rounded w-8"></div>
</div>
<!-- List Item Placeholder 4 -->
<div class="flex gap-3">
<div class="w-3 h-3 mt-1 rounded-full bg-gray-600 flex-shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-3 bg-gray-600 rounded w-1/3"></div>
<div class="h-2 bg-gray-700 rounded w-3/4"></div>
<div class="h-2 bg-gray-700 rounded w-full"></div>
<div class="h-2 bg-gray-700 rounded w-5/6"></div>
</div>
<div class="h-2 bg-gray-600 rounded w-8"></div>
</div>
<!-- List Item Placeholder 5 -->
<div class="flex gap-3">
<div class="w-3 h-3 mt-1 rounded-full bg-gray-600 flex-shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-3 bg-gray-600 rounded w-1/3"></div>
<div class="h-2 bg-gray-700 rounded w-3/4"></div>
<div class="h-2 bg-gray-700 rounded w-full"></div>
<div class="h-2 bg-gray-700 rounded w-5/6"></div>
</div>
<div class="h-2 bg-gray-600 rounded w-8"></div>
</div>
</div>
</div>
<!-- END: Middle Column -->
<!-- BEGIN: Compose Panel -->
<main class="flex-1 flex flex-col bg-[#212121]">
<!-- Compose Header -->
<div class="h-16 px-6 flex items-center justify-between border-b border-gray-800">
<h2 class="text-lg font-bold text-white tracking-wide">Compose New Email</h2>
<button class="text-gray-400 hover:text-white transition-colors">
<i class="fa-solid fa-xmark"></i>
</button>
</div>
<!-- Compose Form -->
<div class="flex-1 flex flex-col p-6 overflow-y-auto">
<!-- Recipient Fields -->
<div class="space-y-4 mb-6">
<div class="flex items-center gap-4">
<label class="w-16 text-right text-sm text-gray-400 font-medium">To:</label>
<div class="flex-1 relative">
<!-- Active state styling -->
<div class="flex items-center w-full bg-transparent border border-blue-500/50 rounded-md px-3 py-2 shadow-[0_0_0_1px_rgba(59,130,246,0.3)] focus-within:shadow-[0_0_0_2px_rgba(59,130,246,0.5)] transition-shadow">
<input autofocus="" class="flex-1 bg-transparent border-none outline-none text-white p-0 focus:ring-0 text-sm h-5" type="text"/>
<button class="text-gray-400 hover:text-gray-200 ml-2 outline-none">
<i class="fa-regular fa-address-book text-sm"></i>
</button>
</div>
</div>
</div>
<div class="flex items-center gap-4">
<label class="w-16 text-right text-sm text-gray-400 font-medium">Subject:</label>
<div class="flex-1">
<input class="w-full bg-transparent border border-gray-700 rounded-md px-3 py-2 text-white text-sm focus:border-gray-500 focus:ring-0 transition-colors" type="text"/>
</div>
</div>
</div>
<!-- Rich Text Editor Container -->
<div class="flex-1 flex flex-col border border-gray-700 rounded-md overflow-hidden bg-[#1a1a1a]">
<!-- Top Toolbar -->
<div class="flex items-center gap-1 p-2 border-b border-gray-700 bg-[#282828]">
<button class="editor-toolbar-btn font-serif font-bold w-7 h-7">B</button>
<button class="editor-toolbar-btn font-serif italic w-7 h-7">I</button>
<button class="editor-toolbar-btn font-serif underline w-7 h-7">U</button>
<button class="editor-toolbar-btn font-serif line-through w-7 h-7">S</button>
<div class="w-px h-4 bg-gray-700 mx-1"></div>
<button class="editor-toolbar-btn w-7 h-7"><i class="fa-solid fa-link text-[12px]"></i></button>
<div class="w-px h-4 bg-gray-700 mx-1"></div>
<button class="editor-toolbar-btn w-7 h-7"><i class="fa-solid fa-list-ul text-[12px]"></i></button>
<button class="editor-toolbar-btn w-7 h-7"><i class="fa-solid fa-list-ol text-[12px]"></i></button>
<button class="editor-toolbar-btn w-7 h-7"><i class="fa-solid fa-align-left text-[12px]"></i></button>
<button class="editor-toolbar-btn w-7 h-7"><i class="fa-solid fa-outdent text-[12px]"></i></button>
<button class="editor-toolbar-btn w-7 h-7"><i class="fa-solid fa-indent text-[12px]"></i></button>
<div class="w-px h-4 bg-gray-700 mx-1"></div>
<button class="editor-toolbar-btn w-7 h-7"><i class="fa-solid fa-text-slash text-[12px]"></i></button>
</div>
<!-- Editor Area -->
<textarea class="flex-1 w-full bg-transparent border-none text-gray-200 text-sm p-4 resize-none focus:ring-0 outline-none" placeholder=""></textarea>
<!-- Bottom Toolbar / Actions -->
<div class="flex items-center justify-between p-2 border-t border-gray-700 bg-[#282828]">
<div class="flex items-center gap-1">
<button class="editor-toolbar-btn font-serif font-bold w-7 h-7">B</button>
<button class="editor-toolbar-btn font-serif italic w-7 h-7">I</button>
<button class="editor-toolbar-btn font-serif underline w-7 h-7">U</button>
<button class="editor-toolbar-btn font-serif line-through w-7 h-7">S</button>
<button class="editor-toolbar-btn font-serif font-medium w-7 h-7">A</button>
<div class="w-px h-4 bg-gray-700 mx-1"></div>
<button class="editor-toolbar-btn w-7 h-7"><i class="fa-solid fa-link text-[12px]"></i></button>
<button class="editor-toolbar-btn w-7 h-7"><i class="fa-solid fa-list-ul text-[12px]"></i></button>
<button class="editor-toolbar-btn w-7 h-7"><i class="fa-solid fa-list-ol text-[12px]"></i></button>
<button class="editor-toolbar-btn w-7 h-7"><i class="fa-solid fa-align-left text-[12px]"></i></button>
<button class="editor-toolbar-btn w-7 h-7"><i class="fa-solid fa-text-slash text-[12px]"></i></button>
</div>
<button class="editor-toolbar-btn w-7 h-7"><i class="fa-solid fa-paperclip text-sm"></i></button>
</div>
</div>
<!-- Footer Actions -->
<div class="mt-4 flex items-center justify-start">
<button class="bg-[#1a73e8] hover:bg-[#1557b0] text-white text-sm font-medium px-6 py-2 rounded transition-colors duration-200">
            Send
          </button>
</div>
</div>
</main>
<!-- END: Compose Panel -->
</div>
<!-- END: MainContainer -->
</body></html>
